name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore ArchitecturalDreamMachineBackend/ArchitecturalDreamMachineBackend/ArchitecturalDreamMachineBackend.csproj
      - name: Build
        run: dotnet build ArchitecturalDreamMachineBackend/ArchitecturalDreamMachineBackend/ArchitecturalDreamMachineBackend.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test ArchitecturalDreamMachineBackend/ArchitecturalDreamMachineBackend/ArchitecturalDreamMachineBackend.csproj --no-build --configuration Release --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ArchitecturalDreamMachineFrontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ArchitecturalDreamMachineFrontend
      - name: Check for outdated dependencies
        run: npm audit --audit-level=high || true
        working-directory: ArchitecturalDreamMachineFrontend
