version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/ArchitecturalDreamMachineBackend/ArchitecturalDreamMachineBackend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1

  - package-ecosystem: "npm"
    directory: "/ArchitecturalDreamMachineFrontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
